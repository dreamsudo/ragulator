[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragulator"
version = "9.0.1"
description = "The RAGulator (Psypher Labs): teaching-grade PoC for layered defence of an LLM-mediated RAG document access-control system (Google Gemini + RAG)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PoC Author" }]
keywords = ["llm", "gemini", "rag", "security", "access-control", "prompt-injection", "colab"]

dependencies = [
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "faker>=24.0",
    "pandas>=2.0",
    "requests>=2.31",
    "matplotlib>=3.7",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    "langchain-google-genai>=1.0",
    "faiss-cpu>=1.7",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
notebook = ["ipywidgets>=8.0", "ipython>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
ragulator = "ragulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
